<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Borrel 35">
  <!-- Dark ink brand ground -->
  <rect width="64" height="64" rx="14" fill="#1a1120" />
  <!-- Hot-pink graffiti sticker, tilted, thick ink outline -->
  <g transform="rotate(-7 32 32)">
    <rect x="11" y="12" width="42" height="40" rx="9" fill="#f5407c" stroke="#16111e" stroke-width="4" />
    <!-- Bold "35" wordmark in cream -->
    <text x="32" y="41" text-anchor="middle" font-family="'Bangers','Arial Black',sans-serif" font-weight="900" font-size="30" fill="#fbf6ea" stroke="#16111e" stroke-width="1.2" paint-order="stroke" letter-spacing="-1">35</text>
  </g>
  <!-- Giraffe-gold spark accent -->
  <circle cx="52" cy="14" r="6" fill="#f2c22e" stroke="#16111e" stroke-width="3" />
</svg>
